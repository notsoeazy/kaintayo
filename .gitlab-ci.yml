# STAGES
stages:
  - lint
  - test
  - build

# PIPELINE CACHE
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - node_modules/

# DEFAULT CONFIGURATION
default:
  image: node:20
  before_script:
    # Use clean install with offline preference to speed up dependencies loading
    - npm ci --cache .npm --prefer-offline

# LINT WORKFLOW
typecheck:
  stage: lint
  script:
    # Run TypeScript compile check without emitting files
    - npx tsc --noEmit
  only:
    - merge_requests
    - main

# TEST WORKFLOW
test_suite:
  stage: test
  script:
    # Run all unit and component tests with a max worker cap for CI runners
    - npm run test -- --maxWorkers=2
  only:
    - merge_requests
    - main

# BUILD WORKFLOW
eas_build_android:
  stage: build
  script:
    # Trigger Android EAS preview build to get the APK
    - npx eas-cli build --platform android --profile preview --non-interactive
  rules:
    # Automatically build on tag pushes (e.g. releases)
    - if: $CI_COMMIT_TAG
      when: on_success
    # Allow manual triggering from the main branch
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  variables:
    # EXPO_TOKEN must be configured in your GitLab Project Settings under CI/CD Variables
    EXPO_TOKEN: $EXPO_TOKEN
